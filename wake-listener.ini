# Wake listener settings. Quit and restart the listener (tray icon > Quit,
# then run it again) after changing these.

# What to say, lowercase. Several are separated by |.
phrases=hey assistant|okay assistant

# The page it opens: the assistant, starting the voice straight away.
url=https://project-checkin.dev.limestonetg.com/assistant?start=voice

# edge-app or chrome-app (a clean app window, best for starting by itself),
# or default (a tab in your default browser).
browser=edge-app

# How sure Windows must be that it heard the phrase, 0.1 to 0.99.
# Raise it if it opens by mistake; lower it if it misses you.
confidence=0.7

# Seconds to ignore the phrase after opening, so it doesn't open twice.
cooldown=45
